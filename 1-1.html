<html>

<head>
  <title>Cascading style sheet</title>
</head>

<link rel="stylesheet" type="text/css" href="example.css">

<style>
  div {
    background: yellow;
    width: 500;
    height: 300;
    margin: 10;
  }

  H1 {
    font-size: 16;
    color: blue
  }
</style>

<body>
  <H1> This is examples of embedded style sheet</h1>
  <div>
    <ul>
      <li>sample text1</li>
      <li>sample text2</li>
      <li>sample text3</li>
      <p>"ปูม้าครับ ปูม้า ตอนนี้ปูหมดครับ เหลือแต่ม้า"</p>
    </ul>
  </div><br>
  <h1> this is the second h1</h1>
</body>

</html>
